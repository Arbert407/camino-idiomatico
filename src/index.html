<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>B2 IT English - camino-idiomatico</title>
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <link rel="stylesheet" href="styles.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#2563eb">
    <meta name="description" content="B2 English learning app for IT professionals - works offline">
</head>
<body>
    <div id="app">
        <header class="header">
            <h1 class="app-title" data-i18n="appTitle" onclick="App.showWelcome()" style="cursor:pointer">B2 IT English</h1>
            <nav class="nav-tabs">
                <button class="nav-tab active" data-view="grammar" data-i18n="grammar">Grammar</button>
                <button class="nav-tab" data-view="rules" data-i18n="rules">Rules</button>
                <button class="nav-tab" data-view="flashcards" data-i18n="flashcards">🎴 IT Cards</button>
                <button class="nav-tab" data-view="exercises" data-i18n="exercises">Exercises</button>
                <button class="nav-tab" data-view="progress" data-i18n="progress">Progress</button>
            </nav>
        </header>

        <div class="toolbar">
            <select id="lesson-select" class="lesson-select">
                <option value="">Select a lesson...</option>
            </select>
            <div class="toolbar-actions">
                <button id="btn-audio-play" class="btn btn-icon" title="Play Audio (TTS)" onclick="App.playAudio()">
                    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M11 5L6 9H2v6h4l5 4V5z"/>
                        <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"/>
                    </svg>
                </button>
                <button id="btn-exercise" class="btn btn-icon" title="Practice Exercise" onclick="App.openExercise()">
                    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
                    </svg>
                </button>
                <button id="btn-bookmark" class="btn btn-icon" title="Bookmark" onclick="App.toggleBookmark()">
                    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/>
                    </svg>
                </button>
            </div>
        </div>

        <main id="content" class="content">
            <div class="welcome-screen">
                <h2 data-i18n="welcome">Welcome to B2 IT English</h2>
                <p data-i18n="welcomeDesc">Master professional English for IT with grammar guides, native phrases, and interactive exercises.</p>
                <div class="quick-start">
                    <h3 data-i18n="quickStart">Quick Start</h3>
                    <div class="quick-start-grid">
                        <button class="quick-start-card" data-view="grammar">
                            <span class="card-icon">📖</span>
                            <span class="card-title" data-i18n="grammar">Grammar</span>
                            <span class="card-desc" data-i18n="grammarDesc">65 grammar lessons</span>
                        </button>
                        <button class="quick-start-card" data-view="rules">
                            <span class="card-icon">💬</span>
                            <span class="card-title" data-i18n="rules">Phrases & Rules</span>
                            <span class="card-desc" data-i18n="rulesDesc">Native expressions</span>
                        </button>
                        <button class="quick-start-card" data-view="flashcards">
                            <span class="card-icon">🎴</span>
                            <span class="card-title">IT Cards</span>
                            <span class="card-desc">Vocabulary flashcards</span>
                        </button>
                        <button class="quick-start-card" data-view="exercises">
                            <span class="card-icon">✏️</span>
                            <span class="card-title" data-i18n="exercises">Exercises</span>
                            <span class="card-desc" data-i18n="exercisesDesc">Practice B2 tests</span>
                        </button>
                        <button class="quick-start-card" data-view="progress">
                            <span class="card-icon">📊</span>
                            <span class="card-title" data-i18n="progress">Progress</span>
                            <span class="card-desc" data-i18n="progressDesc">Track your learning</span>
                        </button>
                    </div>
                </div>
            </div>
        </main>

        <aside id="sidebar" class="sidebar hidden">
            <div class="sidebar-header">
                <h3 data-i18n="tableOfContents">Table of Contents</h3>
                <button id="sidebar-close" class="btn-close">&times;</button>
            </div>
            <div id="toc-list" class="toc-list"></div>
        </aside>

        <div id="exercise-modal" class="modal hidden">
            <div class="modal-content">
                <div class="modal-header">
                    <h3 id="exercise-title" data-i18n="practiceExercise">Practice Exercise</h3>
                    <button id="exercise-close" class="btn-close">&times;</button>
                </div>
                <div id="exercise-body" class="modal-body"></div>
                <div class="modal-footer">
                    <button id="exercise-check" class="btn btn-primary" data-i18n="checkAnswer">Check Answer</button>
                    <button id="exercise-next" class="btn btn-secondary hidden" data-i18n="nextQuestion">Next Question</button>
                </div>
            </div>
        </div>

        <div id="flashcard-container" class="flashcard-container hidden">
            <div class="flashcard" id="flashcard" onclick="App.flipFlashcard()">
                <div class="flashcard-type" id="flashcard-type">Vocabulary</div>
                <div class="flashcard-front" id="flashcard-front">Click Start to begin</div>
                <div class="flashcard-back hidden" id="flashcard-back"></div>
            </div>
            <div class="flashcard-buttons">
                <button class="btn btn-danger" id="flashcard-wrong" onclick="App.flashcardResult(false)">❌ Don't Know</button>
                <button class="btn btn-primary" id="flashcard-start" onclick="App.startFlashcards()">Start</button>
                <button class="btn btn-success" id="flashcard-right" onclick="App.flashcardResult(true)">✅ Know It!</button>
            </div>
            <div class="flashcard-score">Score: <span id="flashcard-score-value">0</span></div>
        </div>

        <footer class="footer">
            <p data-i18n="footer">camino-idiomatico | B2 IT English | Works Offline</p>
        </footer>
    </div>

    <div id="toast" class="toast hidden"></div>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
